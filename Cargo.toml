[package]
name = "monarch-lazyvpn"
version = "0.1.0"
edition = "2021"
description = "TUI WireGuard multi-provider VPN manager"
authors = ["y0no"]
license = "MIT"

[[bin]]
name = "monarch-lazyvpn"
path = "src/main.rs"

[[bin]]
name = "monarch-lazyvpn-status"
path = "src/bin/monarch-lazyvpn-status.rs"

[dependencies]
# TUI
ratatui = "0.26"
crossterm = "0.27"

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"

# HTTP
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Secrets
keyring = "2"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"

# Signal handling
ctrlc = { version = "3", features = ["termination"] }

# File locking
fs2 = "0.4"

# Encryption for keyring fallback
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

# Password input
rpassword = "7"

# Compression for log rotation
flate2 = "1"

# Notifications
notify-rust = "4"

# Network monitoring
rtnetlink = "0.14"
netlink-packet-route = "0.19"

# Base64 for key validation
base64 = "0.22"

# Unix utilities
libc = "0.2"
dirs = "6.0.0"

# Unicode width calculation for proper emoji display
unicode-width = "0.1"
indexmap = "2.13.0"

[dev-dependencies]
mockall = "0.12"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
